name: Pickolo CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: pickolo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - run: npm ci
      - run: npm run validate:repo
      - run: npm run lint
      - run: npm run test:customer
      - run: npm run test:partner
      - run: npm run test:admin
      - run: npm run test:rollout
      - run: npm run test:recovery
      - run: npm run test:payment-sandbox
      - run: npm run build

  customer-mobile:
    name: Customer mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - run: npm ci
      - run: npm run typecheck --workspace @pickolo/customer

  partner-mobile:
    name: Partner mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - run: npm ci
      - run: npm run typecheck --workspace @pickolo/partner
      - run: npm test --workspace @pickolo/partner
      - run: npm run test:dependencies
      - run: npm run test:notifications
      - run: npm run test:release --workspace @pickolo/partner
      - run: npm run test:native-config --workspace @pickolo/partner
