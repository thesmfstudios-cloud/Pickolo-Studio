name: Pickolo app readiness audit
on:
  push:
    branches: [codex/android-test-apk-20261102]
    paths:
      - '.github/workflows/app-readiness.yml'
      - '.github/scripts/check-pickolo-runtime.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Install web test dependencies
        run: npm install
      - name: Run customer database regression tests
        run: npm run test:customer
      - name: Check public production integrations
        if: always()
        run: node .github/scripts/check-pickolo-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pickolo-Readiness-Report
          path: readiness-report/
          if-no-files-found: warn
          retention-days: 14

  production-regression:
    name: Regression tests for the deployed production source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: e43ece27b0c386e2310985f53114d0dbbd3ad613
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install production lockfile
        run: npm ci
      - name: Customer lifecycle and payment integrity
        run: npm run test:customer
      - name: Password recovery regressions
        if: always()
        run: npm run test:recovery
      - name: Partner approval regressions
        if: always()
        run: npm run test:approval
      - name: Isolated payment sandbox regressions
        if: always()
        run: npm run test:payment-sandbox
